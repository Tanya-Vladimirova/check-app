<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — План чек-апа</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 40px; }
        .container { 
            max-width: 450px; 
            margin: 40px auto; 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        h2 { color: #007bff; text-align: center; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: bold; }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ced4da; 
            border-radius: 8px; 
            box-sizing: border-box; /* Чтобы padding не раздувал ширину */
            font-size: 16px;
        }
        
        .register-btn {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.2);
            margin-top: 10px;
        }
        .register-btn:hover {
            background-color: #0056b3;
            box-shadow: 0 6px 10px rgba(0, 123, 255, 0.3);
            transform: translateY(-1px);
        }
        
        .login-link { text-align: center; margin-top: 20px; font-size: 14px; color: #777; }
        .login-link a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Создать профиль 👤</h2>
        <form action="/register" method="post">
            <div class="form-group">
                <label for="full_name">Как вас зовут?</label>
                <input type="text" id="full_name" name="full_name" placeholder="Иван Иванов" required>
            </div>
            <div class="form-group">
                <label for="username">Придумайте логин</label>
                <input type="text" id="username" name="username" placeholder="ivan_2026" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="register-btn">Зарегистрироваться</button>
        </form>
        <div class="login-link">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </div>
    </div>
</body>
</html>
